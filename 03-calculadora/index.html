<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Clássica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculadora">
        <input type="text" id="visor" readonly placeholder="0">

        <!-- Teclado da calculadora -->
        <div class="teclado">
            <!-- Linha 1 -->
            <button onclick="limpar()" class="btn-acao">C</button>
         <button onclick="adicionar('*')">*</button>
         <button onclick="adicionar('/')">/</button>
            <button onclick="adicionar('-')">-</button>
    

            <!-- Linha 2 -->
              <button onclick="adicionar('7')">7</button>
            <button onclick="adicionar('8')">8</button>
            <button onclick="adicionar('9')">9</button>
            <button onclick="adicionar('+')" class="btn-operador">+</button>
            <button onclick="adicionar('1')">1</button>
            <button onclick="adicionar('2')">2</button>
            <button onclick="adicionar('3')">3</button>
        
            

            <!-- Linha 3 -->
              <button onclick="calcular()" class="btn-igual">=</button>
              <button onclick="adicionar('5')">5</button>
            <button onclick="adicionar('6')">6</button>
            <button onclick="adicionar('4')">4</button>
            <button class="btn-zero">0</button>
            <button>.</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
